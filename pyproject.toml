[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-rpc-python"
version = "0.5.4"
description = "Zero-runtime-bindings easy-rpc core for Python (Connect wire: unary + server-stream)."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["easyrpc*"]
